[build]
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  # Ship @netlify/blobs with every function (the scheduled sync.mjs needs it at runtime).
  external_node_modules = ["@netlify/blobs"]

# Optional: run the polling/notification check on a schedule instead of (or in
# addition to) the Claude-managed scheduled task described in the README.
# Uncomment to enable a Netlify Scheduled Function (requires a paid plan tier
# that supports Scheduled Functions):
#
# [functions."notify-on-change"]
#   schedule = "@hourly"
